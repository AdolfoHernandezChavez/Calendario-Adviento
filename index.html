<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuestro calendario de Adviento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
<!-- Icono y "instalar en pantalla de inicio" -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0f2a1e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Adviento">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

</head>
<body>
<canvas id="nieve" aria-hidden="true"></canvas>

<main>
  <header>
    <p class="para" id="para"></p>
    <h1 id="titulo"></h1>
    <p class="sub" id="subtitulo"></p>
    <span class="estado" id="estado"></span>
  </header>
  <section class="rejilla" id="rejilla" aria-label="Casillas del calendario"></section>
  <footer id="firma"></footer>
</main>

<!-- Pestaña de cada día -->
<div class="dia" id="dia" role="dialog" aria-modal="true" aria-label="Día del calendario">
  <div class="barra">
    <button id="ant">‹ Anterior</button>
    <button id="cerrar">Volver al calendario</button>
    <button id="sig">Siguiente ›</button>
  </div>
  <div class="contenido">
    <div>
      <div class="marco" id="marco"><div class="visor" id="visor"></div><p class="pie-foto" id="pieFoto"></p></div>
    </div>
    <div class="texto">
      <div class="gran" id="gran"></div>
      <div class="mes">de diciembre</div>
      <h2 id="dTitulo"></h2>
      <p id="dTexto"></p>
      <div class="acciones" id="acciones"></div>
    </div>
  </div>
</div>
<div class="aviso" id="aviso" role="status"></div>

<script src="js/config.js"></script>
<script src="js/nieve.js"></script>
<script src="js/app.js"></script>

</body>
</html>
